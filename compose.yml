# nextpage web app behind Traefik.
#
#   cp example.env .env   # fill in the values
#   docker compose up -d --build
#
# Course notes are kept in the nextpage_courses volume. To write them to a host
# folder instead (e.g. inside your Obsidian vault), set COURSES_PATH to that
# folder; the container runs as PUID:PGID so the notes are owned by you.
services:
  nextpage:
    build: .
    image: nextpage:latest
    container_name: nextpage
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Optional: the model server can also be set (and changed) in the web
      # app's Settings, which take precedence over these.
      OLLAMASERVER: ${OLLAMASERVER:-}
      MODEL: ${MODEL:-}
      OLLAMAUSER: ${OLLAMAUSER:-}
      OLLAMAPASS: ${OLLAMAPASS:-}
      NEXTPAGE_PASSWORD: ${NEXTPAGE_PASSWORD:?set NEXTPAGE_PASSWORD in .env}
      LOGPATH: /data/nextpage.log
    volumes:
      - nextpage_data:/data
      - ${COURSES_PATH:-nextpage_courses}:/courses
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.nextpage.rule=Host(`${WEB_URL:?set WEB_URL in .env}`)
      - traefik.http.routers.nextpage.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.nextpage.tls=true
      - traefik.http.routers.nextpage.tls.certresolver=myresolver
      - traefik.http.services.nextpage.loadbalancer.server.port=8080

volumes:
  nextpage_data:
  nextpage_courses:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
